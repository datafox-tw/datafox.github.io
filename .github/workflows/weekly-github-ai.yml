name: Weekly GitHub AI Trending Post

on:
  schedule:
    - cron: '30 4 * * 0'  # Sunday 12:30 Taiwan time (UTC+8)
  workflow_dispatch:        # allow manual trigger for testing

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate weekly post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/weekly_github_ai.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/news/
          git diff --staged --quiet || (
            git commit -m "Weekly GitHub AI trends $(date +%Y-%m-%d)" &&
            git push
          )
